[package]
name = "sonora"
version = "1.0.0"
edition = "2021"
description = "Audiophile FLAC terminal music player built with ratatui and crossterm"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
discord-rich-presence = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
rand = "0.9"
ratatui = "0.30"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-flac"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
